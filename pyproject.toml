[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripen"
version = "0.2.0"
description = "Latent neural SDEs with exact first-passage likelihoods for predicting when produce spoils, plus SDE gradient benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishad Wajge" }]
dependencies = [
  "jax>=0.4.30",
  "equinox>=0.11",
  "diffrax>=0.6",
  "optax>=0.2",
  "numpy",
  "scipy",
  "pandas",
  "openpyxl",
  "matplotlib",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit", "lifelines"]
features = ["torch", "torchvision", "pillow", "pillow-heif"]
reports = ["python-docx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: takes more than ~30 s on CPU"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["foundations/lecture/build", "foundations/experiments/demo_video", "scripts/reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"foundations/lecture/*" = ["E731"]
"foundations/experiments/*" = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["nsde", "ripen"]
