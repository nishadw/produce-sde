name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # same suite as the cluster setup stage and CLAUDE.md
      - run: python -m pytest -q -m "not slow"
        env:
          JAX_PLATFORMS: cpu
      - run: python scripts/smoke_all.py
        env:
          JAX_PLATFORMS: cpu

  # parameter-recovery tests: short training runs held to tight tolerances, so they move a few percent with the
  # jax/numpy version and CPU. Reported, but they don't block a merge.
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m slow
        env:
          JAX_PLATFORMS: cpu
